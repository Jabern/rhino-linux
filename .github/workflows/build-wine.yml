name: Build Patched Wine Runtime

on:
  workflow_dispatch:
    inputs:
      wine_version:
        description: 'Wine upstream git branch/tag'
        required: true
        default: 'wine-11.18'
      create_release:
        description: 'Publish archive to GitHub Releases'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (if publishing)'
        required: false
        default: 'v1.0.0-wine11.18'
  push:
    branches:
      - main
      - dev
    paths:
      - 'patches/**'
      - '.github/workflows/build-wine.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-wine:
    name: Build Wine (${{ inputs.wine_version || 'wine-11.18' }})
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            flex \
            bison \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            g++-mingw-w64-x86-64 \
            g++-mingw-w64-i686 \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxrender-dev \
            libgl-dev \
            libegl-dev \
            libvulkan-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libgnutls28-dev \
            libpulse-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            xz-utils
          echo "=== MinGW Toolchain Versions ==="
          x86_64-w64-mingw32-gcc --version | head -n 1
          x86_64-w64-mingw32-g++ --version | head -n 1
          i686-w64-mingw32-gcc --version | head -n 1
          i686-w64-mingw32-g++ --version | head -n 1

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-wine-${{ runner.os }}-${{ inputs.wine_version || 'wine-11.18' }}-${{ github.sha }}
          restore-keys: |
            ccache-wine-${{ runner.os }}-${{ inputs.wine_version || 'wine-11.18' }}-
            ccache-wine-${{ runner.os }}-

      - name: Configure ccache environment
        run: |
          ccache -M 5G
          ccache -s

      - name: Clone Wine upstream
        run: |
          WINE_VER="${{ inputs.wine_version || 'wine-11.18' }}"
          echo "Cloning Wine $WINE_VER..."
          git clone --depth 1 --branch "$WINE_VER" https://gitlab.winehq.org/wine/wine.git wine-src

      - name: Apply repository patches
        run: |
          cd wine-src
          echo "Applying patch set from patches/..."
          for patch_file in "$GITHUB_WORKSPACE"/patches/*.patch; do
            if [ -f "$patch_file" ]; then
              patch_name="$(basename "$patch_file")"
              echo "::group::Applying $patch_name"
              if ! patch -p1 -N < "$patch_file"; then
                echo "::error file=patches/$patch_name::Failed to apply patch $patch_name"
                echo "=== Rejected hunks ==="
                find . -name "*.rej" -exec echo "--- {} ---" \; -exec cat {} \;
                exit 1
              fi
              echo "::endgroup::"
            fi
          done
          echo "All patches applied successfully."

      - name: Provide the ntsync kernel header
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The runner's kernel headers predate ntsync (Linux 6.14); the header
          # is only needed at build time, Wine uses /dev/ntsync when available.
          mkdir -p kernel-headers/linux
          if [ ! -s kernel-headers/linux/ntsync.h ]; then
            echo "Fetching ntsync.h..."
            curl -fsSL \
              ${GH_TOKEN:+-H "Authorization: token $GH_TOKEN"} \
              -H "Accept: application/vnd.github.v3.raw" \
              -o kernel-headers/linux/ntsync.h \
              https://api.github.com/repos/torvalds/linux/contents/include/uapi/linux/ntsync.h?ref=v6.17 || \
            curl -fsSL --retry 3 -o kernel-headers/linux/ntsync.h \
              https://raw.githubusercontent.com/torvalds/linux/v6.17/include/uapi/linux/ntsync.h
          fi
          echo "006437ee52a3e04f921df77081eb5c21c44c71f598b10ac534c6ef9e78296262  kernel-headers/linux/ntsync.h" | sha256sum -c

      - name: Configure Wine (dual WoW64)
        run: |
          mkdir -p build-wine
          cd build-wine
          ../wine-src/configure \
            --prefix=/opt/wine-rhino \
            --enable-archs=i386,x86_64 \
            --disable-tests \
            --without-capi \
            --without-gstreamer \
            CPPFLAGS="-I$GITHUB_WORKSPACE/kernel-headers" \
            CC="ccache gcc" \
            CXX="ccache g++" \
            i386_CC="ccache i686-w64-mingw32-gcc" \
            i386_CXX="ccache i686-w64-mingw32-g++" \
            x86_64_CC="ccache x86_64-w64-mingw32-gcc" \
            x86_64_CXX="ccache x86_64-w64-mingw32-g++"

          echo "=== Verifying critical configuration requirements ==="
          err=0
          grep -q '^#define SONAME_LIBXDAMAGE ' include/config.h || { echo "::error::XDamage support missing from Wine configuration"; err=1; }
          grep -q '^#define HAVE_LINUX_NTSYNC_H 1' include/config.h || { echo "::error::ntsync support missing from Wine configuration"; err=1; }
          grep -q '^#define SONAME_LIBX11 ' include/config.h || { echo "::error::X11 support missing from Wine configuration"; err=1; }
          grep -q '^#define SONAME_LIBFREETYPE ' include/config.h || { echo "::error::FreeType font rendering missing from Wine configuration"; err=1; }

          # Verify that ICU is enabled in Makefile for both architectures
          if ! grep -q 'dlls/icu/x86_64-windows/icu.dll' Makefile; then
            echo "::error::64-bit ICU (x86_64 icu.dll) was not enabled by configure; MinGW C++ compiler or ICU headers missing"
            err=1
          fi
          if ! grep -q 'dlls/icu/i386-windows/icu.dll' Makefile; then
            echo "::error::32-bit ICU (i386 icu.dll) was not enabled by configure; MinGW C++ compiler or ICU headers missing"
            err=1
          fi
          if [ $err -ne 0 ]; then
            echo "=== Relevant configure warnings / errors ==="
            grep -i -E "warning|error|unsupported|c\+\+|icu" config.log | tail -n 50 || true
            exit 1
          fi
          echo "Configuration validation passed successfully."

      - name: Compile Wine
        run: |
          cd build-wine
          make -j$(nproc)
          ccache -s

      - name: Stage and Package Wine Runtime
        run: |
          cd build-wine
          make install DESTDIR="$GITHUB_WORKSPACE/staging"
          cd "$GITHUB_WORKSPACE/staging/opt/wine-rhino"

          # icuuc/icuin are forwarders to icu.dll: without the C++ compiler Wine silently
          # omits icu.dll, and .NET exits with "Cannot get symbol u_charsToUChars".
          echo "=== Verifying ICU implementation and forwarders ==="
          for arch in x86_64 i386; do
            test -s "lib/wine/$arch-windows/icu.dll" || { echo "::error::Missing $arch ICU implementation (icu.dll); check MinGW C++ compiler"; exit 1; }
            test -s "lib/wine/$arch-windows/icuuc.dll" || { echo "::error::Missing $arch icuuc.dll forwarder"; exit 1; }
            test -s "lib/wine/$arch-windows/icuin.dll" || { echo "::error::Missing $arch icuin.dll forwarder"; exit 1; }
          done

          # Verify u_charsToUChars export in x86_64 icu.dll
          if command -v x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            x86_64-w64-mingw32-objdump -p lib/wine/x86_64-windows/icu.dll | grep -q "u_charsToUChars" || {
              echo "::error::Required symbol u_charsToUChars missing from x86_64 icu.dll exports (.NET globalization will fail)"; exit 1;
            }
            echo "Verified u_charsToUChars export in x86_64 icu.dll."
          fi

          # Runtime only: drop headers and import libraries, strip debug
          # information and symbols (Wine only needs exports at run time).
          rm -rf include
          find . -name '*.a' -delete
          find lib/wine/x86_64-unix -type f -name '*.so' -exec strip --strip-unneeded {} +
          strip --strip-unneeded bin/wineserver lib/wine/x86_64-unix/wine lib/wine/x86_64-unix/wine-preloader 2>/dev/null || true
          find lib/wine/x86_64-windows -type f -exec x86_64-w64-mingw32-strip --strip-unneeded {} + 2>/dev/null || true
          find lib/wine/i386-windows -type f -exec i686-w64-mingw32-strip --strip-unneeded {} + 2>/dev/null || true
          ./bin/wine --version
          # Refuse runtimes that only start on newer CPUs: glibc will not load a binary
          # whose ISA note asks for more than baseline x86-64 (v1.1.0 asked for v4).
          if find bin lib/wine/x86_64-unix -type f -exec readelf -n {} + 2>/dev/null | grep -E 'x86 ISA needed:.*x86-64-v[2-4]'; then
            echo "::error::Runtime requires a newer x86-64 level than baseline"; exit 1
          fi

          WINE_VER="${{ inputs.wine_version || 'wine-11.18' }}"
          TARBALL="wine-rhino-${WINE_VER#wine-}-x86_64.tar.xz"
          echo "Packaging $TARBALL..."
          tar -cf - * | xz -9 -T0 > "$GITHUB_WORKSPACE/$TARBALL"

          cd "$GITHUB_WORKSPACE"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          echo "SHA256=$(cat $TARBALL.sha256 | awk '{print $1}')" >> $GITHUB_ENV

          echo "Generated archive: $TARBALL ($(du -h "$TARBALL" | cut -f1))"
          cat "$TARBALL.sha256"

      - name: Upload Wine Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARBALL }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          retention-days: 14

      - name: Upload config.log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wine-configure-log
          path: build-wine/config.log
          retention-days: 7

      - name: Publish to GitHub Releases
        if: github.event_name == 'release' || inputs.create_release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          draft: false
          prerelease: false
          # never replace a runtime already published (install.sh pins its checksum)
          overwrite_files: false
