# Rhino 9 WIP under Wine — Optimized DXVK configuration
#
# Hardware adapter identity exposure:
dxgi.hideNvidiaGpu = False
dxgi.hideAmdGpu = False
dxgi.hideIntelGpu = False
d3d9.hideNvidiaGpu = False

# Shader & Pipeline Compilation:
# Graphics Pipeline Libraries compile optimized pipelines on background threads,
# and DXVK waits for those compiles when Rhino closes: with a cold shader cache
# that made closing Rhino take ~50 s (measured: 47-49 s with GPL, 3-9 s without).
# Without GPL a new display mode may hitch once; the driver cache makes later
# sessions instant.
dxvk.enableGraphicsPipelineLibrary = False
# 0 = auto-detect all available CPU hardware threads for parallel background compilation
dxvk.numCompilerThreads = 0
dxvk.trackPipelineLifetime = True

# Presentation & UI Latency:
# Eliminate swapchain queuing delays and decouple V-Sync stalls
dxgi.syncInterval = 0
d3d9.presentInterval = 0
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1
dxvk.tearFree = False

# Direct3D 9 (WPF / UI Controls & Ribbons) Tuning:
d3d9.cachedWriteOnlyBuffers = True
d3d9.deviceLocalConstantBuffers = True
# WPF creates a new swap chain for every panel each time the window is resized.
# DXVK 2.4 builds the Vulkan swap chain when the D3D9 swap chain is created and
# again on its first Present (m_dirty starts out true), so every panel paid for
# two. Deferring creation to the first Present builds it once: 42 -> 19 swap
# chains per test run, and maximize settles in ~300 ms instead of ~460 ms.
# But then the first frame of a new WPF window can be lost: on the first start,
# the sign-in window ("Welcome to Rhino") stayed blank every time, and license
# questions showed only their buttons, until minimized and restored. Off until
# Wine keeps that frame.
d3d9.deferSurfaceCreation = False

# Direct3D 11 Draw Call & Pipeline Optimizations:
# Relax pipeline barriers to reduce CPU-GPU synchronization overhead
d3d11.relaxedBarriers = True
# Eliminate redundant CPU-side range bounds checking on constant buffer uploads in draw call hot path
d3d11.constantBufferRangeCheck = False
# Cache dynamic resources in fast staging buffers
d3d11.cachedDynamicResources = "a"
# Force 16x anisotropic filtering for crisp viewport texture mapping at steep grazing angles
d3d11.samplerAnisotropy = 16
# Maximum hardware tessellation factor for smooth SubD and NURBS curvature
d3d11.maxTessellationFactor = 64
