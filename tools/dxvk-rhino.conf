# Rhino 9 WIP under Wine — Optimized DXVK configuration
#
# Hardware adapter identity exposure:
dxgi.hideNvidiaGpu = False
dxgi.hideAmdGpu = False
dxgi.hideIntelGpu = False
d3d9.hideNvidiaGpu = False

# Shader & Pipeline Compilation:
# Enable Vulkan Graphics Pipeline Libraries (GPL) for smooth runtime compilation
dxvk.enableGraphicsPipelineLibrary = True
# 0 = auto-detect all available CPU hardware threads for parallel background compilation
dxvk.numCompilerThreads = 0
dxvk.trackPipelineLifetime = True

# Presentation & UI Latency:
# Eliminate swapchain queuing delays and decouple V-Sync stalls
dxgi.syncInterval = 0
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1

# Direct3D 11 Draw Call & Pipeline Optimizations:
# Relax pipeline barriers to reduce CPU-GPU synchronization overhead
d3d11.relaxedBarriers = True
# Eliminate redundant CPU-side range bounds checking on constant buffer uploads in draw call hot path
d3d11.constantBufferRangeCheck = False
# Cache dynamic resources in fast staging buffers
d3d11.cachedDynamicResources = "a"
# Force 16x anisotropic filtering for crisp viewport texture mapping at steep grazing angles
d3d11.samplerAnisotropy = 16
# Maximum hardware tessellation factor for smooth SubD and NURBS curvature
d3d11.maxTessellationFactor = 64
